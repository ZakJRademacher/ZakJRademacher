# Runs the feed every Monday and commits the database and the new spreadsheet.
# Works once this folder is its own repository (GitHub only reads workflows
# from .github/workflows at the repository root).
# Optional: add a SOCRATA_APP_TOKEN repository secret for a higher rate limit.
name: Weekly permits feed

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: permits-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch new permits
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python -m permits_feed run --report-dir reports
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/permits.db reports/
          git diff --cached --quiet || git commit -m "Permits feed $(date -u +%Y-%m-%d)"
          git push
